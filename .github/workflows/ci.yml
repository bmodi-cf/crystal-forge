name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit arrives —
# during fast TDD bursts only the latest commit gets a full run, the rest
# get cancelled so we don't burn the free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crystal
          POSTGRES_PASSWORD: crystal
          POSTGRES_DB: crystal_forge
        ports:
          # Map to host port 5433 to match docker-compose.yml so the test
          # setup's hard-coded :5433 connection strings work unchanged.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U crystal -d crystal_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crystal:crystal@localhost:5433/crystal_forge?schema=public
      AUTH_SECRET: ci-secret-not-for-real-use-1234567890abcdef
      NEXTAUTH_URL: http://localhost
      AUTH_DEV_USERS_ENABLED: "true"
      GITHUB_CLIENT_MODE: fake
      GITHUB_REPO_OWNER: bmodi-cf
      GITHUB_TEMPLATE_REPO: bmodi-cf/crystal-forge-template-webapp
      GITHUB_BASE_URL: https://github.com
      DB_PROVISIONER_MODE: fake
      HARNESS_PG_HOST: localhost
      HARNESS_PG_PORT: "5433"
      HARNESS_PG_USER: crystal
      HARNESS_PG_PASSWORD: crystal

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Next typegen
        # Generates next-env.d.ts and .next/types/* (RouteContext, etc.)
        # without doing a full build. Required for typecheck to find the
        # generated route helpers.
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
