services:
  postgres:
    image: postgres:16-alpine
    container_name: crystal-forge-pg
    environment:
      POSTGRES_USER: crystal
      POSTGRES_PASSWORD: crystal
      POSTGRES_DB: crystal_forge
    ports:
      # Bound to loopback so forge containers can't reach it via the docker gateway.
      - "127.0.0.1:5433:5432"
    networks:
      - crystal-forge-net
    volumes:
      - crystal-forge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystal -d crystal_forge"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Durable pilot infra: dockerd brings this back after *its own* restart, not
    # just after a reboot. crystal-forge.service's ExecStartPre only runs when the
    # dashboard unit starts, so it cannot cover a dockerd restart underneath a
    # live dashboard — which is what an `apt upgrade` of docker-ce does. On
    # 2026-09-16 that left the dashboard up on a dead database for four minutes.
    restart: unless-stopped

  registry:
    image: registry:2
    container_name: crystal-forge-registry
    environment:
      # Enable the DELETE manifest API so forges can be removed from the registry.
      # Deletion unlinks manifests/tags; disk space is reclaimed by
      # `registry garbage-collect /etc/docker/registry/config.yml`.
      # ⚠️ NEVER add --delete-untagged: it corrupts our buildx OCI-index images by
      # pruning their (untagged) child manifests. See docs/runbooks/pilot-registry-infra.md.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # Loopback only — nginx terminates TLS in front (see P1 runbook). Forge
      # containers can't reach it directly, same posture as postgres above.
      - "127.0.0.1:5000:5000"
    networks:
      - crystal-forge-net
    volumes:
      - crystal-forge-registry-data:/var/lib/registry
    # Durable pilot infra: self-restart on reboot and after a dockerd restart,
    # same as postgres above.
    restart: unless-stopped

volumes:
  crystal-forge-pgdata:
  crystal-forge-registry-data:

networks:
  crystal-forge-net:
    name: crystal-forge-net
