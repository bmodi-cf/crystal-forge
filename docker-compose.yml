services:
  postgres:
    image: postgres:16-alpine
    container_name: crystal-forge-pg
    environment:
      POSTGRES_USER: crystal
      POSTGRES_PASSWORD: crystal
      POSTGRES_DB: crystal_forge
    ports:
      # Bound to loopback so forge containers can't reach it via the docker gateway.
      - "127.0.0.1:5433:5432"
    networks:
      - crystal-forge-net
    volumes:
      - crystal-forge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystal -d crystal_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  registry:
    image: registry:2
    container_name: crystal-forge-registry
    environment:
      # Enable the DELETE manifest API so forges can be removed from the registry.
      # Deletion unlinks manifests/tags; disk space is reclaimed by
      # `registry garbage-collect /etc/docker/registry/config.yml` (see README).
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # Loopback only — nginx terminates TLS in front (see P1 runbook). Forge
      # containers can't reach it directly, same posture as postgres above.
      - "127.0.0.1:5000:5000"
    networks:
      - crystal-forge-net
    volumes:
      - crystal-forge-registry-data:/var/lib/registry
    # Durable pilot infra: self-restart on reboot (unlike postgres, which
    # forge-launch.sh relaunches each session).
    restart: unless-stopped

volumes:
  crystal-forge-pgdata:
  crystal-forge-registry-data:

networks:
  crystal-forge-net:
    name: crystal-forge-net
